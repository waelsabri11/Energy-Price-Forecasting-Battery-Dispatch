name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # synthetic fixtures only: no ENTSOE_API_KEY needed, no network
      - run: uv run pytest -m "slow or not slow" --cov=energy_forecasting --cov-report=term

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t energy-forecasting:ci .
      - run: docker build -t energy-mlflow:ci -f docker/mlflow.Dockerfile .

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kubeconform
        run: |
          curl -fsSL -o kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "$(curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/CHECKSUMS | grep kubeconform-linux-amd64.tar.gz | cut -d' ' -f1)  kc.tgz" | sha256sum -c -
          tar xzf kc.tgz kubeconform && sudo mv kubeconform /usr/local/bin/
      - run: kubectl kustomize k8s/base | kubeconform -strict -summary -kubernetes-version 1.33.0
