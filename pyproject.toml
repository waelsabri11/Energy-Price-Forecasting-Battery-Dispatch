[project]
name = "energy-forecasting"
version = "0.1.0"
description = "Probabilistic day-ahead electricity price forecasting (FR) and LP battery dispatch"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "entsoe-py>=0.6.16",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "cvxpy>=1.5",
  "highspy>=1.7",
  "pandera>=0.20",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "tenacity>=9.0",
  "mlflow>=2.16,<3",
  "sqlalchemy>=2.0.30,<2.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "matplotlib>=3.9",
  "typer>=0.12",
  "tabulate>=0.9",
  "holidays>=0.107",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_forecasting"]

[project.scripts]
energy = "energy_forecasting.cli:app"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: end-to-end pipeline run (make test-all)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
